openapi: 3.1.0
info:
  title: Puntazo API · programa gratuito
  version: 0.3.0-contract
  description: |
    Contrato de lanzamiento gratuito para programas Sellos y Puntos.
    Cada operación marcada IMPLEMENTED cuenta con código, persistencia, autorización
    y pruebas de contrato/integración dentro del repositorio aislado de preview.
  x-puntazo-slice: FREE-LAUNCH-SELLOS-PUNTOS
  x-puntazo-authority: ACORDADO_PARA_DEMO
  x-puntazo-approved-decisions: [PC-04, PC-09, PC-10, PC-11, PC-13, PC-14]
  x-puntazo-partial-decisions: [PC-12]
  x-puntazo-deferred: [PC-01, PC-03, PC-05, PC-06, PC-07, PC-08]
servers:
  - url: https://puntazo-preview.blakyta3d.duckdns.org/api/v1
    description: Staging VPS; el gateway web es el único servicio público
  - url: http://localhost:8080/v1
    description: Desarrollo local de API
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Demo
  - name: Cuenta
  - name: Marcas
  - name: Clientes
  - name: Analíticas
  - name: Movimientos
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      security: []
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: El proceso está vivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      security: []
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: API, PostgreSQL y migración requerida están listos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /version:
    get:
      tags: [Health]
      operationId: getVersion
      security: []
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Versión desplegada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerCustomer
      summary: Registra exclusivamente una cuenta cliente final gratuita
      security: []
      x-puntazo-implementation: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCustomerRequest' }
      responses:
        '201':
          description: Cliente creado sin suscripción; QR emitido y almacenado sólo como hash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /demo/comercios:
    post:
      tags: [Demo]
      operationId: registerDemoMerchant
      summary: Alta atómica e idempotente de un propietario con programa Sellos o Puntos
      security: []
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDemoMerchantRequest' }
      responses:
        '201':
          description: Usuario, marca, propietario, sucursal y programa creados; onboarding continúa sin beneficio
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoMerchantEnvelope' }
        '403': { $ref: '#/components/responses/DemoSignupClosed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      x-puntazo-implementation: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me:
    get:
      tags: [Cuenta]
      operationId: getCurrentUser
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Identidad y membresías restaurables en otro dispositivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /marcas:
    get:
      tags: [Marcas]
      operationId: listMyBrands
      summary: Lista sólo marcas alcanzadas por la membresía del actor
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Marcas visibles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantContextListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /marcas/{brand_id}:
    get:
      tags: [Marcas]
      operationId: getMyBrand
      summary: Contexto Sellos de una marca propia
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/BrandId'
      responses:
        '200':
          description: Marca, sucursal, programa, beneficio y acceso demo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantContextEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /marcas/{brand_id}/movimientos:
    get:
      tags: [Movimientos]
      operationId: listBrandMovements
      summary: Historial de la marca limitado a membresía y sucursales autorizadas
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/BrandId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Movimientos visibles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementPageEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /marcas/{brand_id}/clientes:
    get:
      tags: [Clientes]
      operationId: listBrandCustomers
      summary: Lista clientes con tarjeta y saldo real de la marca
      description: Sólo lectura para propietarios activos; nunca devuelve el QR del cliente.
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/BrandId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Clientes visibles, ordenados por actividad más reciente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandCustomerPageEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /marcas/{brand_id}/metricas/resumen:
    get:
      tags: [Analíticas]
      operationId: getBrandOperationalSummary
      summary: Totales operativos históricos de la marca
      description: |
        Resumen de sólo lectura calculado desde tarjetas y movimientos confirmados.
        No implementa todavía períodos, comparaciones, predicciones ni drill-down de PC-08.
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/BrandId'
      responses:
        '200':
          description: Totales históricos visibles para el propietario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationalSummaryEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clientes/me:
    get:
      tags: [Clientes]
      operationId: getCurrentCustomer
      summary: Devuelve el QR opaco sólo a su dueño
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Perfil del cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clientes/me/tarjetas:
    get:
      tags: [Clientes]
      operationId: listCurrentCustomerCards
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tarjetas y saldos persistidos del cliente autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardPageEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clientes/me/tarjetas/{card_id}/movimientos:
    get:
      tags: [Clientes]
      operationId: listCurrentCustomerCardMovements
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Historial de una tarjeta propia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementPageEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /movimientos/preview:
    post:
      tags: [Movimientos]
      operationId: previewMovement
      summary: Calcula Sellos por QR o ID de cliente sin cambiar tarjeta ni historial; vence a los cinco minutos
      x-puntazo-implementation: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementPreviewRequest' }
      responses:
        '200':
          description: Preview temporal, sin reserva de saldo y utilizable una vez
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /movimientos/scan:
    post:
      tags: [Movimientos]
      operationId: confirmAccumulation
      summary: Confirma una acumulación Sellos transaccional
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmAccumulationRequest' }
      responses:
        '201':
          description: Un sello acreditado y movimiento persistido en la misma transacción
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /movimientos/canje:
    post:
      tags: [Movimientos]
      operationId: confirmRedemption
      summary: Confirma un canje Sellos transaccional
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmRedemptionRequest' }
      responses:
        '201':
          description: Sellos debitados y movimiento persistido en la misma transacción
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /movimientos/idempotencia/{idempotency_key}:
    get:
      tags: [Movimientos]
      operationId: getMovementByIdempotencyKey
      summary: Resuelve un resultado incierto sin reenviar la mutación
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyPath'
      responses:
        '200':
          description: Resultado previamente confirmado por el mismo actor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    IdempotentReplayed:
      description: "true cuando la respuesta se reprodujo desde el registro idempotente"
      schema: { type: boolean }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKeyPath:
      name: idempotency_key
      in: path
      required: true
      schema: { type: string, format: uuid }
    BrandId:
      name: brand_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CardId:
      name: card_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: search
      in: query
      description: Búsqueda parcial por nombre o email del cliente
      schema: { type: string, maxLength: 120 }
  responses:
    Unauthenticated:
      description: Sesión ausente o inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: El actor no posee el tipo de cuenta, marca o sucursal requerida
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Recurso inexistente o fuera del ownership visible
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Conflicto de email, idempotencia, preview o saldo
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ValidationError:
      description: Request válido como JSON pero inválido para el contrato
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RateLimited:
      description: Límite por IP, email u operador excedido
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    DependencyUnavailable:
      description: PostgreSQL o esquema requerido no disponible
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    DemoSignupClosed:
      description: Altas cerradas o código de demo inválido
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    Timestamp:
      type: string
      format: date-time
    RequestId:
      type: string
      format: uuid
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
    VersionResponse:
      type: object
      additionalProperties: false
      required: [version, commit, schema_version]
      properties:
        version: { type: string }
        commit: { type: string, pattern: '^[0-9a-f]{7,40}$' }
        schema_version: { type: string, pattern: '^[0-9]{4}$' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, EMAIL_EXISTS, IDEMPOTENCY_CONFLICT, IDEMPOTENCY_IN_PROGRESS, PREVIEW_EXPIRED, PREVIEW_CONSUMED, PREVIEW_CHANGED, INSUFFICIENT_BALANCE, DEMO_SIGNUP_DISABLED, DEMO_ACCESS_DENIED, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]
            message: { type: string }
            details: { type: object, additionalProperties: true }
        request_id: { $ref: '#/components/schemas/RequestId' }
    AccountType:
      type: string
      enum: [CLIENTE_FINAL, PERSONAL_MARCA]
    User:
      type: object
      additionalProperties: false
      required: [id, email, name, account_type, active, created_at]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        account_type: { $ref: '#/components/schemas/AccountType' }
        active: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    Membership:
      type: object
      additionalProperties: false
      required: [brand_id, brand_name, role, branch_ids]
      properties:
        brand_id: { type: integer, format: int64 }
        brand_name: { type: string }
        role: { type: string, const: PROPIETARIO }
        branch_ids:
          type: array
          items: { type: integer, format: int64 }
    Session:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in:
          type: integer
          const: 86400
          description: Sesión demo sin refresh; refresh tokens permanecen diferidos
    AuthData:
      type: object
      additionalProperties: false
      required: [session, user]
      properties:
        session: { $ref: '#/components/schemas/Session' }
        user: { $ref: '#/components/schemas/User' }
    AuthEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/AuthData' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    RegisterCustomerRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 72
          description: Máximo 72 bytes en UTF-8 por compatibilidad con bcrypt
        name: { type: string, minLength: 1, maxLength: 120 }
    RegisterDemoMerchantRequest:
      type: object
      additionalProperties: false
      required: [email, password, owner_name, brand_name, branch_name, program_type, access_code]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 72
          description: Máximo 72 bytes en UTF-8 por compatibilidad con bcrypt
        owner_name: { type: string, minLength: 1, maxLength: 120 }
        brand_name: { type: string, minLength: 1, maxLength: 120 }
        branch_name: { type: string, minLength: 1, maxLength: 120 }
        branch_address: { type: string, maxLength: 240 }
        program_type: { type: string, enum: [SELLOS, PUNTOS] }
        access_code:
          type: string
          minLength: 12
          maxLength: 128
          description: Se compara contra bcrypt y nunca se persiste ni registra en claro
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [user, memberships, onboarding_complete]
      properties:
        user: { $ref: '#/components/schemas/User' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
        onboarding_complete: { type: boolean }
    CurrentUserEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/CurrentUser' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    DemoAccess:
      type: object
      additionalProperties: false
      required: [kind, price_minor, currency, automatic_charge, active, started_at]
      properties:
        kind: { type: string, enum: [SELLOS_FREE_TRIAL, PUNTOS_FREE_TRIAL] }
        price_minor: { type: integer, const: 0 }
        currency: { type: string, const: ARS }
        automatic_charge: { type: boolean, const: false }
        active: { type: boolean }
        started_at: { $ref: '#/components/schemas/Timestamp' }
    Branch:
      type: object
      additionalProperties: false
      required: [id, brand_id, name, active]
      properties:
        id: { type: integer, format: int64 }
        brand_id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: [string, 'null'] }
        active: { type: boolean }
    Program:
      type: object
      additionalProperties: false
      required: [id, brand_id, type, active]
      properties:
        id: { type: integer, format: int64 }
        brand_id: { type: integer, format: int64 }
        type: { type: string, enum: [SELLOS, PUNTOS] }
        stamps_per_accumulation: { type: integer, const: 1 }
        active: { type: boolean }
    Benefit:
      type: object
      additionalProperties: false
      required: [id, program_id, name, active]
      properties:
        id: { type: integer, format: int64 }
        program_id: { type: integer, format: int64 }
        name: { type: string }
        required_stamps: { type: integer, minimum: 1, maximum: 10000000 }
        required_points: { type: integer, minimum: 1, maximum: 10000000 }
        active: { type: boolean }
    MerchantContext:
      type: object
      additionalProperties: false
      required: [brand_id, brand_name, role, branch, program, benefits, demo_access]
      properties:
        brand_id: { type: integer, format: int64 }
        brand_name: { type: string }
        role: { type: string, const: PROPIETARIO }
        branch: { $ref: '#/components/schemas/Branch' }
        program: { $ref: '#/components/schemas/Program' }
        benefit: { $ref: '#/components/schemas/Benefit' }
        benefits:
          type: array
          items: { $ref: '#/components/schemas/Benefit' }
        demo_access: { $ref: '#/components/schemas/DemoAccess' }
    MerchantContextEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/MerchantContext' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    MerchantContextListEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MerchantContext' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    DemoMerchantData:
      type: object
      additionalProperties: false
      required: [session, user, merchant, onboarding_complete]
      properties:
        session: { $ref: '#/components/schemas/Session' }
        user: { $ref: '#/components/schemas/User' }
        merchant: { $ref: '#/components/schemas/MerchantContext' }
        onboarding_complete: { type: boolean, const: false }
    DemoMerchantEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/DemoMerchantData' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    Customer:
      type: object
      additionalProperties: false
      required: [id, email, name, qr_token]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        qr_token:
          type: string
          minLength: 32
          description: Token opaco de presentación; no autoriza y sólo su hash existe en PostgreSQL
    CustomerEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/Customer' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    Card:
      type: object
      additionalProperties: false
      required: [id, brand_id, brand_name, program_type, balance_stamps, balance_points, benefit]
      properties:
        id: { type: integer, format: int64 }
        brand_id: { type: integer, format: int64 }
        brand_name: { type: string }
        program_type: { type: string, enum: [SELLOS, PUNTOS] }
        balance_stamps: { type: integer, format: int64, minimum: 0 }
        balance_points: { type: integer, format: int64, minimum: 0 }
        benefit: { $ref: '#/components/schemas/Benefit' }
    Pagination:
      type: object
      additionalProperties: false
      required: [page, page_size, total_items, total_pages]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total_items: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
    CardPageEnvelope:
      type: object
      additionalProperties: false
      required: [data, pagination, request_id]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Card' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    BrandCustomer:
      type: object
      additionalProperties: false
      required: [customer_id, card_id, name, email, program_type, balance_stamps, balance_points, movements_count, last_movement_at, joined_at]
      properties:
        customer_id: { type: integer, format: int64 }
        card_id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, format: email }
        program_type: { type: string, enum: [SELLOS, PUNTOS] }
        balance_stamps: { type: integer, format: int64, minimum: 0 }
        balance_points: { type: integer, format: int64, minimum: 0 }
        movements_count: { type: integer, format: int64, minimum: 0 }
        last_movement_at: { type: [string, 'null'], format: date-time }
        joined_at: { $ref: '#/components/schemas/Timestamp' }
    BrandCustomerPageEnvelope:
      type: object
      additionalProperties: false
      required: [data, pagination, request_id]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BrandCustomer' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    OperationalSummary:
      type: object
      additionalProperties: false
      required: [active_customers, program_type, current_stamp_balance, current_point_balance, accumulations, redemptions, stamps_issued, stamps_redeemed, points_issued, points_redeemed, last_movement_at]
      properties:
        active_customers: { type: integer, format: int64, minimum: 0 }
        program_type: { type: string, enum: [SELLOS, PUNTOS] }
        current_stamp_balance: { type: integer, format: int64, minimum: 0 }
        current_point_balance: { type: integer, format: int64, minimum: 0 }
        accumulations: { type: integer, format: int64, minimum: 0 }
        redemptions: { type: integer, format: int64, minimum: 0 }
        stamps_issued: { type: integer, format: int64, minimum: 0 }
        stamps_redeemed: { type: integer, format: int64, minimum: 0 }
        points_issued: { type: integer, format: int64, minimum: 0 }
        points_redeemed: { type: integer, format: int64, minimum: 0 }
        last_movement_at: { type: [string, 'null'], format: date-time }
    OperationalSummaryEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/OperationalSummary' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    MovementOperation:
      type: string
      enum: [ACUMULACION, CANJE]
    MovementPreviewRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [operation, qr_token, branch_id]
          properties:
            operation: { type: string, const: ACUMULACION }
            qr_token: { type: string, minLength: 32, maxLength: 256 }
            branch_id: { type: integer, format: int64, minimum: 1 }
            cantidad_puntos:
              type: integer
              minimum: 1
              maximum: 100000
              description: Obligatoria para PUNTOS; debe omitirse para SELLOS, donde el servidor fija 1
        - type: object
          additionalProperties: false
          required: [operation, customer_code, branch_id]
          properties:
            operation: { type: string, const: ACUMULACION }
            customer_code: { $ref: '#/components/schemas/CustomerCode' }
            branch_id: { type: integer, format: int64, minimum: 1 }
            cantidad_puntos:
              type: integer
              minimum: 1
              maximum: 100000
              description: Obligatoria para PUNTOS; debe omitirse para SELLOS, donde el servidor fija 1
        - type: object
          additionalProperties: false
          required: [operation, qr_token, branch_id, benefit_id]
          properties:
            operation: { type: string, const: CANJE }
            qr_token: { type: string, minLength: 32, maxLength: 256 }
            branch_id: { type: integer, format: int64, minimum: 1 }
            benefit_id: { type: integer, format: int64, minimum: 1 }
        - type: object
          additionalProperties: false
          required: [operation, customer_code, branch_id, benefit_id]
          properties:
            operation: { type: string, const: CANJE }
            customer_code: { $ref: '#/components/schemas/CustomerCode' }
            branch_id: { type: integer, format: int64, minimum: 1 }
            benefit_id: { type: integer, format: int64, minimum: 1 }
    CustomerCode:
      type: string
      description: ID de miembro visible en Mi Pasaporte; el prefijo # y las mayúsculas se normalizan en la API.
      pattern: '^#?[Uu][Ss][Ee][Rr]-[0-9]{4,19}$'
      maxLength: 25
    Preview:
      type: object
      additionalProperties: false
      required: [id, expires_at, operation, program_type, customer, card_id, balance_before, amount, balance_after]
      properties:
        id: { type: string, format: uuid }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        operation: { $ref: '#/components/schemas/MovementOperation' }
        program_type: { type: string, enum: [SELLOS, PUNTOS] }
        customer:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
        card_id: { type: integer, format: int64 }
        balance_before: { type: integer, format: int64, minimum: 0 }
        amount: { type: integer, format: int64, minimum: 1 }
        balance_after: { type: integer, format: int64, minimum: 0 }
        benefit: { oneOf: [{ $ref: '#/components/schemas/Benefit' }, { type: 'null' }] }
    PreviewEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/Preview' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    ConfirmAccumulationRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [preview_id, qr_token, branch_id]
          properties:
            preview_id: { type: string, format: uuid }
            qr_token: { type: string, minLength: 32, maxLength: 256 }
            branch_id: { type: integer, format: int64, minimum: 1 }
        - type: object
          additionalProperties: false
          required: [preview_id, customer_code, branch_id]
          properties:
            preview_id: { type: string, format: uuid }
            customer_code: { $ref: '#/components/schemas/CustomerCode' }
            branch_id: { type: integer, format: int64, minimum: 1 }
    ConfirmRedemptionRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [preview_id, qr_token, branch_id, benefit_id]
          properties:
            preview_id: { type: string, format: uuid }
            qr_token: { type: string, minLength: 32, maxLength: 256 }
            branch_id: { type: integer, format: int64, minimum: 1 }
            benefit_id: { type: integer, format: int64, minimum: 1 }
        - type: object
          additionalProperties: false
          required: [preview_id, customer_code, branch_id, benefit_id]
          properties:
            preview_id: { type: string, format: uuid }
            customer_code: { $ref: '#/components/schemas/CustomerCode' }
            branch_id: { type: integer, format: int64, minimum: 1 }
            benefit_id: { type: integer, format: int64, minimum: 1 }
    Movement:
      type: object
      additionalProperties: false
      required: [id, operation_id, card_id, branch_id, operation, program_type, direction, amount, balance_before, balance_after, occurred_at]
      properties:
        id: { type: integer, format: int64 }
        operation_id: { type: string, format: uuid }
        card_id: { type: integer, format: int64 }
        brand_id: { type: integer, format: int64 }
        brand_name: { type: string }
        branch_id: { type: integer, format: int64 }
        branch_name: { type: string }
        operation: { $ref: '#/components/schemas/MovementOperation' }
        program_type: { type: string, enum: [SELLOS, PUNTOS] }
        direction: { type: string, enum: [CREDITO, DEBITO] }
        amount: { type: integer, format: int64, minimum: 1 }
        balance_before: { type: integer, format: int64, minimum: 0 }
        balance_after: { type: integer, format: int64, minimum: 0 }
        benefit_name_snapshot: { type: [string, 'null'] }
        benefit_required_stamps_snapshot: { type: [integer, 'null'], format: int64 }
        benefit_required_points_snapshot: { type: [integer, 'null'], format: int64 }
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
    MovementEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/Movement' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    MovementPageEnvelope:
      type: object
      additionalProperties: false
      required: [data, pagination, request_id]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Movement' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        request_id: { $ref: '#/components/schemas/RequestId' }
